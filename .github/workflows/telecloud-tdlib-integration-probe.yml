name: TeleCloud TDLib integration probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout TeleCloud
        uses: actions/checkout@v4

      - name: Download successful TDLib build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9974844725
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tdlib-bundle
          run-id: 33981719376

      - name: Inspect generated TDLib bundle
        shell: bash
        run: |
          set -euo pipefail
          echo 'TDLib bundle files:'
          find tdlib-bundle -maxdepth 4 -type f | sort | sed -n '1,120p'
          bundle=$(find tdlib-bundle -name 'tdlib.zip' -type f | head -1)
          test -n "$bundle"
          echo 'TDLib ZIP layout:'
          unzip -l "$bundle" | sed -n '1,80p'
          mkdir -p tdlib-unpacked
          unzip -q "$bundle" -d tdlib-unpacked
          java_dir=$(find tdlib-unpacked -type d -name java | head -1)
          test -n "$java_dir"
          echo "Generated Java bindings in: $java_dir"
          find "$java_dir" -type f | sort | sed -n '1,40p'
          echo 'Native libraries:'
          find tdlib-bundle -type f -name '*.so' | sort

      - name: Integrate official TDLib sources into app build
        shell: bash
        run: |
          set -euo pipefail
          java_dir=$(find tdlib-unpacked -type d -name java | head -1)
          mkdir -p app/src/main/java app/src/main/jniLibs
          cp -R "$java_dir"/org app/src/main/java/
          cp -R tdlib-bundle/tdlib-android-bundle/libs/. app/src/main/jniLibs/
          test -f app/src/main/java/org/drinkless/tdlib/Client.java
          test -f app/src/main/java/org/drinkless/tdlib/TdApi.java
          test -f app/src/main/jniLibs/arm64-v8a/libtdjni.so
          echo 'Official TDLib sources and native libraries are now part of this app build.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create debug keystore for baseline build
        run: keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US'

      - name: Build TeleCloud APK with TDLib
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload TeleCloud APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telecloud-tdlib-real-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
